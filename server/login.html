<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inloggen · Campagnemonitor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Inter';font-weight:400 600;font-display:swap;src:url('/fonts/inter-latin.woff2') format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;font-display:swap;src:url('/fonts/poppins-600-latin.woff2') format('woff2')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#FDFBF8;color:#1D1D1B;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;box-shadow:0 2px 8px rgba(29,29,27,.09);padding:32px 28px;display:flex;flex-direction:column;gap:20px}
img{height:34px;align-self:flex-start}
h1{margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.01em}
p{margin:4px 0 0;font-size:14px;color:#5C5C5A;line-height:1.5}
label{font-size:14px;font-weight:600;display:block;margin-bottom:8px}
input{width:100%;height:44px;border:1px solid #E4E1DE;border-radius:8px;padding:0 14px;font:inherit;font-size:15px}
input:focus{outline:2px solid rgba(27,27,99,.3);outline-offset:0;border-color:#1B1B63}
button{height:48px;border:0;border-radius:8px;background:linear-gradient(135deg,#F9CE00 0%,#FB8915 100%);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
button:focus-visible{outline:2px solid rgba(27,27,99,.45);outline-offset:2px}
.err{margin:0;background:#FDECEA;color:#D32F2F;border-radius:8px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <img src="/logo.png" alt="Horeca Toppers">
  <div>
    <h1>Campagnemonitor</h1>
    <p>Log in met het teamwachtwoord.</p>
  </div>
  {{error}}
  <div>
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  </div>
  <button type="submit">Inloggen</button>
</form>
</body>
</html>
