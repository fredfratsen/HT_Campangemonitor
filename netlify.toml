# Netlify: the built app is served as static files; the server (login, API, one-time links) runs as the
# function in netlify/functions/server.mjs, with its data in Netlify Blobs. Set SECRETS_KEY under
# Site configuration › Environment variables before the first deploy. See README › Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "qrcode-generator", "@netlify/blobs", "nodemailer"]

# The same security headers the server sends, for the static files.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
