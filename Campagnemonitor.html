document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

     #FFFFFF;\n\n  /* ─── Semantic Colors ─── */\n  --color-bg:            var(--color-white);\n  --color-bg-subtle:     var(--color-mid);\n  --color-bg-dark:       var(--color-accent);\n  --color-fg:            var(--color-dark);\n  --color-fg-muted:      var(--color-dark-60);\n  --color-fg-faint:      var(--color-dark-40);\n  --color-border:        var(--color-dark-10);\n  --color-border-strong: var(--color-dark-20);\n  --color-link:          var(--color-accent);\n  --color-focus-ring:    rgba(27, 27, 99, 0.3);\n\n  /* Status */\n  --color-success:       #1A7A4A;\n  --color-success-bg:    #E6F4ED;\n  --color-warning:       #B45309;\n  --color-warning-bg:    #FEF3C7;\n  --color-error:         #D32F2F;\n  --color-error-bg:      #FDECEA;\n\n  /* ─── Typography ─── */\n  --font-display:  'Poppins', system-ui, sans-serif;\n  --font-body:     'Inter', system-ui, sans-serif;\n\n  /* Weights */\n  --fw-regular:    400; /* @kind font */\n  --fw-medium:     500; /* @kind font */\n  --fw-semibold:   600; /* @kind font */\n  --fw-bold:       700; /* @kind font */\n\n  /* Scale — Desktop */\n  --text-hero:     clamp(2.5rem, 5vw, 4rem);      /* ~64px max */\n  --text-h1:       clamp(2rem, 3.5vw, 3.5rem);    /* ~56px max */\n  --text-h2:       clamp(1.5rem, 2.5vw, 2.5rem);  /* ~40px max */\n  --text-h3:       clamp(1.2rem, 2vw, 1.75rem);   /* ~28px max */\n  --text-h4:       1.25rem;   /* 20px */\n  --text-body-lg:  1.125rem;  /* 18px */\n  --text-body:     1rem;      /* 16px */\n  --text-sm:       0.875rem;  /* 14px */\n  --text-xs:       0.75rem;   /* 12px */\n\n  /* Line heights */\n  --lh-tight:      1.1; /* @kind other */\n  --lh-snug:       1.2; /* @kind other */\n  --lh-normal:     1.4; /* @kind other */\n  --lh-relaxed:    1.6; /* @kind other */\n  --lh-loose:      1.8; /* @kind other */\n\n  /* Letter spacing */\n  --ls-tight:      -0.02em; /* @kind other */\n  --ls-normal:     0; /* @kind other */\n  --ls-wide:       0.04em; /* @kind other */\n  --ls-wider:      0.08em sc-if>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px\">\n                      <label style=\"font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#1B1B63\"><\u002Fspan>Feedback recruitment<\u002Flabel>\n                      <textarea value=\"{{ form.rec }}\" sc-camel-on-change=\"{{ setRecText }}\" rows=\"4\" placeholder=\"Wat zie en hoor jij bij de instroom en de kandidaten?\" style=\"border:1px solid #E4E1DE;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical\"><\u002Ftextarea>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px\">\n                      <label style=\"font-size:14px;font-weight:600\">Eventuele actie / notitie<\u002Flabel>\n                      <textarea value=\"{{ form.note }}\" sc-camel-on-change=\"{{ setNote }}\" rows=\"2\" placeholder=\"Optioneel\" style=\"border:1px solid #E4E1DE;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical\"><\u002Ftextarea>\n                      <button sc-camel-on-click=\"{{ toggleNeeds }}\" style=\"align-self:flex-start;display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;cursor:pointer;font-size:14px\">\n                        <span style=\"width:36px;height:20px;border-radius:999px;background:{{ needsBg }};position:relative;flex:none;transition:background 150ms\"><span style=\"position:absolute;top:2px;left:{{ needsKnob }};width:16px;height:16px;border-radius:50%;background:#FFFFFF;transition:left 150ms\"><\u002Fspan><\u002Fspan>\n                        Bijsturing nodig <span style=\"color:#8C8C8A;font-size:13px\">– zet campagne op Actie nodig<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:16px 28px;border-top:1px solid #E4E1DE;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#FDFBF8;border-radius:0 0 12px 12px\">\n                    <span style=\"font-size:12px;color:#8C8C8A\">Toets 1–0 voor de score · Ctrl/⌘ + Enter om op te slaan<\u002Fspan>\n                    <x-import component-from-global-scope=\"HorecaToppersDesignSystem_019dc9.Button\" variant=\"primary\" size=\"lg\" sc-camel-on-click=\"{{ saveForm }}\" hint-size=\"190px,48px\">{{ saveLabel }}<\u002Fx-import>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ queueComplete }}\">\n                <div style=\"background:#E6F4ED;border-radius:12px;padding:20px 24px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n                  <div><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px;color:#1A7A4A\">Alles ingevuld voor week 39<\u002Fdiv><div style=\"font-size:13px;color:#3C3C3A\">Je kunt eerdere check-ins nog aanpassen in de lijst.<\u002Fdiv><\u002Fdiv>\n                  <x-import component-from-global-scope=\"HorecaToppersDesignSystem_019dc9.Button\" variant=\"accent\" sc-camel-on-click=\"{{ goMine }}\" hint-size=\"170px,40px\">Naar mijn campagnes<\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- LIVE CAMPAGNES (recruiter) -->\n      <sc-if value=\"{{ isLive }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#5C5C5A\">Maandag 28 september<\u002Fdiv>\n              <h1 style=\"margin:6px 0 0;font-family:Poppins,sans-serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.02em\">Live campagnes<\u002Fh1>\n              <div style=\"margin-top:8px;color:#5C5C5A;font-size:15px\">Belwerk vandaag voor {{ live.count }} live campagnes · uit Trello<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#5C5C5A\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ syncDot }}\"><\u002Fspan>{{ syncText }}<\u002Fdiv>\n          <\u002Fheader>\n          <sc-if value=\"{{ live.hasOpen }}\">\n            <button sc-camel-on-click=\"{{ goCheckin }}\" style=\"border:0;background:#FFF8E0;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;font-size:14px\">\n              <span style=\"flex:1;min-width:0\"><strong>{{ live.openText }}<\u002Fstrong> <span style=\"color:#3C3C3A;white-space:nowrap\">voor week 39<\u002Fspan><\u002Fspan><span style=\"font-weight:600;color:#1B1B63;white-space:nowrap\">Feedback invullen →<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ live.hasChanges }}\">\n            <div style=\"background:#FFFFFF;border:1.5px solid #F9A800;border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px\">{{ live.chTitle }}<\u002Fspan><span style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-size:12px;color:#8C8C8A\">{{ live.sinceText }}<\u002Fspan><button sc-camel-on-click=\"{{ live.markSeen }}\" style=\"border:1px solid #E4E1DE;background:#FFFFFF;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer\">Gezien<\u002Fbutton><\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ live.changes }}\" as=\"ch\">\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px\">\n                  <span style=\"font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:{{ ch.tBg }};color:{{ ch.tFg }}\">{{ ch.tag }}<\u002Fspan>\n                  <span><strong>{{ ch.client }}<\u002Fstrong> <span style=\"color:#3C3C3A\">{{ ch.text }}<\u002Fspan><\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:12px;color:#8C8C8A\">{{ ch.at }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ live.isEmpty }}\"><div style=\"background:#FFFFFF;border:1px dashed #C0BDB9;border-radius:12px;padding:22px 24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px\">Nog geen klanten aan jou toegewezen<\u002Fdiv><div style=\"font-size:14px;color:#5C5C5A;margin-top:4px\">Zodra de teamlead je aan klanten koppelt via Toewijzing, zie je hier je belwerk van vandaag.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n            <sc-for list=\"{{ live.kpis }}\" as=\"k\" hint-placeholder-count=\"3\">\n              <div style=\"background:{{ k.bg }};border:1px solid {{ k.border }};border-radius:12px;padding:16px 18px\">\n                <div style=\"font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:{{ k.lfg }}\">{{ k.label }}<\u002Fdiv>\n                <div style=\"margin-top:6px;font-family:Poppins,sans-serif;font-weight:600;font-size:34px;line-height:1.1;color:{{ k.fg }}\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:{{ k.lfg }};margin-top:2px\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;overflow-x:auto\">\n            <div style=\"min-width:560px\">\n              <div style=\"display:grid;grid-template-columns:minmax(160px,1.4fr) 96px 120px 64px minmax(0,1fr);gap:16px;padding:12px 20px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8C8C8A;border-bottom:1px solid #E4E1DE;align-items:end\">\n                <div>Klant · vacature<\u002Fdiv><div style=\"text-align:right\">Nieuw bellen<\u002Fdiv><div style=\"text-align:right\">Contactpogingen<\u002Fdiv><div style=\"text-align:right\">Totaal<\u002Fdiv><div><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ live.rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <div sc-camel-on-click=\"{{ r.open }}\" style=\"display:grid;grid-template-columns:minmax(160px,1.4fr) 96px 120px 64px minmax(0,1fr);gap:16px;padding:12px 20px;border-bottom:1px solid #F5F2ED;align-items:center;cursor:pointer;font-size:14px\" style-hover=\"background:#FDFBF8\">\n                  <div style=\"min-width:0;display:flex;align-items:center;gap:10px\"><span style=\"width:8px;height:8px;border-radius:50%;flex:none;background:{{ r.dot }}\"><\u002Fspan><span style=\"min-width:0\"><span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600\">{{ r.client }}<sc-if value=\"{{ r.hasBadge }}\"><span style=\"font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:{{ r.bBg }};color:{{ r.bFg }}\">{{ r.badge }}<\u002Fspan><\u002Fsc-if><\u002Fspan><span style=\"display:block;font-size:12px;color:#5C5C5A\">{{ r.vac }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div style=\"text-align:right;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:{{ r.nFg }}\">{{ r.nieuw }}<\u002Fdiv>\n                  <div style=\"text-align:right;font-family:Poppins,sans-serif;font-weight:600;font-size:18px;color:{{ r.cFg }}\">{{ r.contact }}<\u002Fdiv>\n                  <div style=\"text-align:right;font-family:Poppins,sans-serif;font-weight:600;font-size:18px\">{{ r.total }}<\u002Fdiv>\n                  <div style=\"display:flex;height:10px;border-radius:999px;overflow:hidden;background:#F5F2ED\">\n                    <div style=\"width:{{ r.nPct }};background:#1B1B63\"><\u002Fdiv><div style=\"width:{{ r.cPct }};background:#FB8915\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#5C5C5A\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#1B1B63\"><\u002Fspan>Nieuw: kaarten in lijst ‘Nieuw’, nog niet gebeld<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#FB8915\"><\u002Fspan>Contactpogingen: kaarten in lijst ‘Contactpoging’, opnieuw bellen<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- TRELLO KOPPELINGEN -->\n      <sc-if value=\"{{ isTrello }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#5C5C5A\">Koppelingen<\u002Fdiv>\n              <h1 style=\"margin:6px 0 0;font-family:Poppins,sans-serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.02em\">Klanten uit Trello<\u002Fh1>\n              <div style=\"margin-top:8px;color:#5C5C5A;font-size:15px;max-width:640px;text-wrap:pretty\">Elk bord is een klant, elk label een functie. Nieuwe borden en labels verschijnen hier automatisch. Koppel een label aan een recruiter en de campagne staat live.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#5C5C5A\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ syncDot }}\"><\u002Fspan>{{ tr.syncText }}<\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n            <div style=\"display:flex;gap:2px;background:#F5F2ED;border-radius:999px;padding:3px;flex:none\">\n              <sc-for list=\"{{ tr.tabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:0;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.sh }}\">{{ t.label }} <span style=\"color:#8C8C8A\">{{ t.n }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-size:13px;color:#5C5C5A\">{{ tr.summary }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ tr.toggleInactive }}\" style=\"margin-left:auto;border:0;background:none;padding:0;font-size:13px;font-weight:500;color:#1B1B63;cursor:pointer\">{{ tr.inactiveText }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ tr.hasNotice }}\"><div style=\"background:#FFF8E0;border-radius:12px;padding:14px 18px;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center\"><span>{{ tr.notice }}<\u002Fspan><sc-if value=\"{{ tr.noticeLink }}\"><a href=\"Trello-koppeling test.dc.html\" style=\"font-weight:600\">Naar testpagina →<\u002Fa><\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ tr.empty }}\"><div style=\"background:#E6F4ED;border-radius:12px;padding:18px 22px;font-size:14px;color:#1A7A4A;font-weight:500\">Alle labels zijn gekoppeld of genegeerd.<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ tr.boards }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;overflow:hidden\">\n              <div style=\"padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #E4E1DE;background:#FDFBF8\">\n                <span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:16px\">{{ b.name }}<\u002Fspan>\n                <sc-if value=\"{{ b.isNew }}\"><span style=\"font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#FFF8E0;color:#B45309\">Nieuw bord · {{ b.found }}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ b.isInactive }}\"><span style=\"font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#F5F2ED;color:#5C5C5A\">{{ b.inactiveText }}<\u002Fspan><\u002Fsc-if>\n                <span style=\"font-size:12px;color:#8C8C8A;margin-left:auto\">{{ b.meta }}<\u002Fspan>\n                <sc-if value=\"{{ b.canIgnore }}\"><button sc-camel-on-click=\"{{ b.ignoreBoard }}\" style=\"border:0;background:none;padding:0;font-size:12px;font-weight:500;color:#5C5C5A;cursor:pointer\">Geen klant<\u002Fbutton><\u002Fsc-if>\n                <sc-if value=\"{{ b.isIgnoredBoard }}\"><span style=\"font-size:12px;color:#8C8C8A\">Genegeerd<\u002Fspan><button sc-camel-on-click=\"{{ b.restoreBoard }}\" style=\"border:0;background:none;padding:0;font-size:12px;font-weight:500;color:#1B1B63;cursor:pointer\">Herstel<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-for list=\"{{ b.labels }}\" as=\"l\">\n                <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:16px;padding:12px 20px;border-top:1px solid #F5F2ED;align-items:center;font-size:14px\">\n                  <div style=\"display:flex;align-items:center;gap:10px;min-width:0\"><span style=\"width:28px;height:8px;border-radius:999px;flex:none;background:{{ l.color }}\"><\u002Fspan><span style=\"font-weight:600;color:{{ l.fg }}\">{{ l.name }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"color:#5C5C5A;font-size:13px\">{{ l.cards }} kaarten<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;justify-content:flex-end\">\n                    <sc-if value=\"{{ l.isLinked }}\"><span style=\"font-size:13px;color:#1A7A4A;font-weight:500\">Gekoppeld · {{ l.rec }}<\u002Fspan><button sc-camel-on-click=\"{{ l.open }}\" style=\"border:0;background:none;padding:0;font-size:13px;font-weight:500;color:#1B1B63;cursor:pointer\">Bekijk →<\u002Fbutton><sc-if value=\"{{ l.canUnlink }}\"><button sc-camel-on-click=\"{{ l.unlink }}\" style=\"border:0;background:none;padding:0;font-size:13px;color:#8C8C8A;cursor:pointer\">Ontkoppelen<\u002Fbutton><\u002Fsc-if><\u002Fsc-if>\n                    <sc-if value=\"{{ l.isEnded }}\"><span style=\"font-size:13px;color:#8C8C8A\">Campagne afgerond<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ l.isInactive }}\"><span style=\"font-size:13px;color:#8C8C8A\">Niet actief, wordt niet gevolgd<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ l.isIgnored }}\"><span style=\"font-size:13px;color:#8C8C8A\">Genegeerd, geen functie<\u002Fspan><button sc-camel-on-click=\"{{ l.unignore }}\" style=\"border:0;background:none;padding:0;font-size:13px;font-weight:500;color:#1B1B63;cursor:pointer\">Herstel<\u002Fbutton><\u002Fsc-if>\n                    <sc-if value=\"{{ l.isOpen }}\">\n                      <input value=\"{{ l.vac }}\" sc-camel-on-change=\"{{ l.setVac }}\" placeholder=\"Functie\" style=\"width:140px;height:34px;border:1px solid #E4E1DE;border-radius:8px;padding:0 10px;font-size:13px\">\n                      <sc-raw-select value=\"{{ l.sel }}\" sc-camel-on-change=\"{{ l.setRec }}\" style=\"height:34px;border:1px solid #E4E1DE;border-radius:8px;padding:0 8px;font-size:13px;background:#FFFFFF\">\n                        <option value=\"\">Kies recruiter<\u002Foption><option value=\"Robin\">Robin<\u002Foption><option value=\"Tsjerk\">Tsjerk<\u002Foption><option value=\"Kim\">Kim<\u002Foption><option value=\"Juul\">Juul<\u002Foption>\n                      <\u002Fsc-raw-select>\n                      <x-import component-from-global-scope=\"HorecaToppersDesignSystem_019dc9.Button\" variant=\"accent\" size=\"sm\" sc-camel-on-click=\"{{ l.link }}\" hint-size=\"90px,32px\">Koppelen<\u002Fx-import>\n                      <sc-if value=\"{{ l.showIgnore }}\"><button sc-camel-on-click=\"{{ l.ignore }}\" style=\"border:0;background:none;padding:0 4px;font-size:13px;color:#5C5C5A;cursor:pointer\">Geen functie<\u002Fbutton><\u002Fsc-if>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- TOEWIJZING -->\n      <sc-if value=\"{{ isAssign }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px\">\n          <header>\n            <div style=\"font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#5C5C5A\">Teamlead<\u002Fdiv>\n            <h1 style=\"margin:6px 0 0;font-family:Poppins,sans-serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.02em\">Toewijzing<\u002Fh1>\n            <div style=\"margin-top:8px;color:#5C5C5A;font-size:15px;max-width:640px;text-wrap:pretty\">Wijs per klant een recruiter en een Recruitment Marketeer toe, of zet de opvolging op ‘Niet actief’. De recruiter geldt voor alle functies van de klant. Een klant die nog niet gekoppeld is, wordt meteen gekoppeld als ‘Alle functies’; per label splitsen kan daarna in Klanten uit Trello.<\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px\">\n            <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:12px;font-weight:500;letter-spaci               <sc-raw-select value=\"{{ hist.rec }}\" sc-camel-on-change=\"{{ setHistRec }}\" style=\"height:40px;border:1px solid #E4E1DE;border-radius:8px;padding:0 10px;font-size:14px;background:#FFFFFF\">\n                <option value=\"all\">Alle recruiters<\u002Foption><option value=\"Robin\">Robin<\u002Foption><option value=\"Tsjerk\">Tsjerk<\u002Foption><option value=\"Kim\">Kim<\u002Foption><option value=\"Juul\">Juul<\u002Foption>\n              <\u002Fsc-raw-select>\n              <sc-raw-select value=\"{{ hist.period }}\" sc-camel-on-change=\"{{ setHistPeriod }}\" style=\"height:40px;border:1px solid #E4E1DE;border-radius:8px;padding:0 10px;font-size:14px;background:#FFFFFF\">\n                <option value=\"12\">Laatste 12 weken<\u002Foption><option value=\"8\">Laatste 8 weken<\u002Foption><option value=\"4\">Laatste 4 weken<\u002Foption>\n              <\u002Fsc-raw-select>\n              <x-import component-from-global-scope=\"HorecaToppersDesignSystem_019dc9.Button\" variant=\"outline\" sc-camel-on-click=\"{{ exportCsv }}\" hint-size=\"130px,40px\">Export CSV<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n            <sc-for list=\"{{ histKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;padding:16px 18px\">\n                <div style=\"font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#5C5C5A\">{{ k.label }}<\u002Fdiv>\n                <div style=\"margin-top:6px;font-family:Poppins,sans-serif;font-weight:600;font-size:26px;line-height:1.1\">{{ k.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;overflow-x:auto\">\n            <div style=\"min-width:1000px;padding:8px 0\">\n              <div style=\"display:grid;grid-template-columns:minmax(230px,1.6fr) minmax(0,{{ histCols }}) 64px 64px 64px 56px;gap:12px;padding:10px 20px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8C8C8A;align-items:end\">\n                <div>Kwaliteit per week<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat({{ histN }},minmax(0,1fr));gap:3px\"><sc-for list=\"{{ histWeeks }}\" as=\"w\"><div style=\"text-align:center\">{{ w }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                <div style=\"text-align:right\">Instroom<\u002Fdiv><div style=\"text-align:right\">Gem. kw.<\u002Fdiv><div style=\"text-align:right\">Geplaatst<\u002Fdiv><div style=\"text-align:right\">Acties<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ histRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n                <div sc-camel-on-click=\"{{ r.open }}\" style=\"display:grid;grid-template-columns:minmax(230px,1.6fr) minmax(0,{{ histCols }}) 64px 64px 64px 56px;gap:12px;padding:6px 20px;align-items:center;cursor:pointer;font-size:13px\" style-hover=\"background:#FDFBF8\">\n                  <div style=\"min-width:0;display:flex;align-items:center;gap:8px\"><span style=\"width:7px;height:7px;border-radius:50%;flex:none;background:{{ r.dot }}\"><\u002Fspan><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\"><strong>{{ r.client }}<\u002Fstrong> <span style=\"color:#5C5C5A\">– {{ r.vac }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat({{ histN }},minmax(0,1fr));gap:3px\">\n                    <sc-for list=\"{{ r.cells }}\" as=\"x\">\n                      <div style=\"height:30px;border-radius:5px;background:{{ x.bg }};color:{{ x.fg }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative\">{{ x.t }}<sc-if value=\"{{ x.act }}\"><span style=\"position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:1px;background:#FB8915;transform:rotate(45deg)\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;font-weight:600\">{{ r.total }}<\u002Fdiv>\n                  <div style=\"text-align:right;font-weight:600;color:{{ r.avgFg }}\">{{ r.avg }}<\u002Fdiv>\n                  <div style=\"text-align:right\">{{ r.placed }}<\u002Fdiv>\n                  <div style=\"text-align:right;color:#5C5C5A\">{{ r.acts }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#5C5C5A;margin-top:-10px\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#E6F4ED\"><\u002Fspan>7–10<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#FEF3C7\"><\u002Fspan>5–6<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#FDECEA\"><\u002Fspan>1–4<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:1px;background:#FB8915;transform:rotate(45deg)\"><\u002Fspan>Campagnewijziging<\u002Fspan>\n          <\u002Fdiv>\n          <section style=\"display:flex;flex-direction:column;gap:12px\">\n            <h2 style=\"margin:0;font-family:Poppins,sans-serif;font-weight:600;font-size:20px\">Wat gebeurde er na een wijziging?<\u002Fh2>\n            <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;overflow-x:auto\">\n              <div style=\"min-width:860px\">\n                <div style=\"display:grid;grid-template-columns:56px minmax(200px,1.2fr) 110px minmax(220px,2fr) 150px 150px;gap:14px;padding:12px 20px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8C8C8A;border-bottom:1px solid #E4E1DE\">\n                  <div>Week<\u002Fdiv><div>Campagne<\u002Fdiv><div>Type<\u002Fdiv><div>Wijziging<\u002Fdiv><div>Kwaliteit vóór → na<\u002Fdiv><div>Instroom vóór → na<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ effects }}\" as=\"e\">\n                  <div sc-camel-on-click=\"{{ e.open }}\" style=\"display:grid;grid-template-columns:56px minmax(200px,1.2fr) 110px minmax(220px,2fr) 150px 150px;gap:14px;padding:12px 20px;border-bottom:1px solid #F5F2ED;font-size:13px;align-items:baseline;cursor:pointer\" style-hover=\"background:#FDFBF8\">\n                    <div style=\"font-weight:600\">W{{ e.w }}<\u002Fdiv>\n                    <div><strong>{{ e.client }}<\u002Fstrong><div style=\"color:#5C5C5A\">{{ e.vac }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"color:#3C3C3A\">{{ e.type }}<\u002Fdiv>\n                    <div style=\"line-height:1.45\">{{ e.text }}<\u002Fdiv>\n                    <div><span>{{ e.q }}<\u002Fspan> <span style=\"font-weight:600;color:{{ e.qFg }}\">{{ e.qd }}<\u002Fspan><\u002Fdiv>\n                    <div><span>{{ e.l }}<\u002Fspan> <span style=\"font-weight:600;color:#5C5C5A\">{{ e.ld }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#8C8C8A\">Vóór = gemiddelde van de 2 weken vóór de wijziging. Na = gemiddelde van de 2 weken erna.<\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- HEALTH-REGELS -->\n      <sc-if value=\"{{ isRules }}\">\n        <div style=\"display:flex;flex-direction:column;gap:24px;max-width:860px\">\n          <header style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#5C5C5A\">Instellingen<\u002Fdiv>\n              <h1 style=\"margin:6px 0 0;font-family:Poppins,sans-serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.02em\">Campagne health<\u002Fh1>\n              <div style=\"margin-top:8px;color:#5C5C5A;font-size:15px;max-width:560px;text-wrap:pretty\">Eén regel die afgaat bepaalt de status. Rood gaat vóór oranje. Wijzigingen gelden direct voor alle schermen.<\u002Fdiv>\n              <sc-if value=\"{{ rulesLocked }}\"><div style=\"margin-top:12px;display:inline-flex;background:#F5F2ED;border-radius:8px;padding:8px 12px;font-size:13px;color:#3C3C3A\">Alleen de teamlead kan de regels aanpassen.<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isLead }}\"><x-import component-from-global-scope=\"HorecaToppersDesignSystem_019dc9.Button\" variant=\"ghost\" sc-camel-on-click=\"{{ resetRules }}\" hint-size=\"140px,40px\">Standaard herstellen<\u002Fx-import><\u002Fsc-if>\n          <\u002Fheader>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <sc-for list=\"{{ sum.levels }}\" as=\"l\"><span style=\"display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:8px 14px;border-radius:999px;background:{{ l.bg }};color:{{ l.fg }};font-weight:600\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ l.fg }}\"><\u002Fspan>{{ l.n }} {{ l.label }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ ruleGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;overflow:hidden\">\n              <div style=\"padding:16px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E4E1DE\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ g.fg }}\"><\u002Fspan><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px\">{{ g.label }}<\u002Fspan><span style=\"font-size:13px;color:#8C8C8A\">{{ g.sub }}<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ g.rules }}\" as=\"r\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:14px 22px;border-top:1px solid #F5F2ED;font-size:14px;flex-wrap:wrap\">\n                  <button sc-camel-on-click=\"{{ r.toggle }}\" disabled=\"{{ r.locked }}\" style=\"width:36px;height:20px;border-radius:999px;border:0;background:{{ r.tBg }};position:relative;cursor:{{ r.cursor }};opacity:{{ r.op }};flex:none;padding:0\"><span style=\"position:absolute;top:2px;left:{{ r.knob }};width:16px;height:16px;border-radius:50%;background:#FFFFFF;transition:left 150ms\"><\u002Fspan><\u002Fbutton>\n                  <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:{{ r.fg }}\">{{ r.pre }}<sc-if value=\"{{ r.hasVal }}\"><input value=\"{{ r.val }}\" sc-camel-on-change=\"{{ r.setVal }}\" disabled=\"{{ r.locked }}\" type=\"number\" style=\"background:#FFFFFF;width:64px;height:34px;border:1px solid #E4E1DE;border-radius:6px;text-align:center;font-size:14px;font-weight:600\"><\u002Fsc-if>{{ r.post }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:12px;color:#8C8C8A\">{{ r.hits }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"background:#FFFFFF;border:1px solid #E4E1DE;border-radius:12px;padding:16px 22px;display:flex;align-items:center;gap:10px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#1A7A4A\"><\u002Fspan><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:17px\">Goed<\u002Fspan><span style=\"font-size:13px;color:#8C8C8A\">Alle campagnes waar geen regel afgaat<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<sc-if value=\"{{ hasPanel }}\">\n  <div sc-camel-on-click=\"{{ closePanel }}\" style=\"position:fixed;inset:0;background:rgba(29,29,27,.12);z-index:20\"><\u002Fdiv>\n  <div style=\"position:fixed;top:16px;right:16px;bottom:16px;width:min(440px,calc(100vw - 32px));background:#FFFFFF;border-radius:12px;box-shadow:0 8px 32px rgba(29,29,27,.18);z-index:21;display:flex;flex-direction:column;overflow:hidden\">\n    <div style=\"padding:18px 22px;border-bottom:1px solid #E4E1DE;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n      <span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:18px\">{{ panelTitle }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ closePanel }}\" style=\"border:0;background:#F5F2ED;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px\">\n\n      <sc-if value=\"{{ isInbox }}\">\n        <div style=\"font-size:13px;color:#5C5C5A;line-height:1.5\">Herinneringen en meldingen voor {{ user.name }}.<\u002Fdiv>\n        <sc-for list=\"{{ inbox.items }}\" as=\"n\">\n          <div style=\"border:1px solid #E4E1DE;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:{{ n.bg }}\">\n            <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#8C8C8A\"><span>{{ n.from }}<\u002Fspan><span>{{ n.at }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:14px;font-weight:600;line-height:1.4\">{{ n.title }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px\"><sc-for list=\"{{ n.lines }}\" as=\"ln\"><span style=\"font-size:13px;color:{{ ln.fg }}\">{{ ln.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <sc-if value=\"{{ n.hasAction }}\"><button sc-camel-on-click=\"{{ n.act }}\" style=\"align-self:flex-start;border:0;background:#1B1B63;color:#FFFFFF;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer\">{{ n.actLabel }}<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ inbox.empty }}\"><div style=\"padding:24px 0;text-align:center;font-size:14px;color:#8C8C8A\">Geen meldingen.<\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-size:12px;color:#8C8C8A;line-height:1.5;border-top:1px solid #F5F2ED;padding-top:12px\">In het echte systeem gaat een herinnering ook per e-mail naar de recruiter (optioneel Slack of Teams). Maandag 09:00 gaat er automatisch een herinnering uit voor open feedback.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNews }}\">\n        <sc-for list=\"{{ news.items }}\" as=\"it\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid #F5F2ED\">\n            <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:{{ it.tagBg }};color:{{ it.tagFg }}\">{{ it.tag }}<\u002Fspan><span style=\"font-size:12px;color:#8C8C8A\">{{ it.date }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600\">{{ it.title }}<\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.55;color:#3C3C3A\">{{ it.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isIdea }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;background:#FDFBF8;border-radius:12px;padding:14px 16px\">\n          <div style=\"display:flex;gap:2px;background:#F5F2ED;border-radius:999px;padding:3px;align-self:flex-start\">\n            <sc-for list=\"{{ idea.types }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.sh }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <textarea value=\"{{ idea.text }}\" sc-camel-on-change=\"{{ setIdeaText }}\" rows=\"4\" placeholder=\"{{ idea.placeholder }}\" style=\"border:1px solid #E4E1DE;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical;background:#FFFFFF\"><\u002Ftextarea>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap\">\n            <span style=\"font-size:12px;color:#8C8C8A\">Scherm: {{ idea.page }} · door {{ user.name }}<\u002Fspan>\n            <x-import component-from-global-scope=\"HorecaToppersDesignSystem_019dc9.Button\" variant=\"primary\" size=\"sm\" sc-camel-on-click=\"{{ submitIdea }}\" hint-size=\"90px,32px\">Versturen<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          <sc-for list=\"{{ idea.filters }}\" as=\"f\"><button sc-camel-on-click=\"{{ f.onClick }}\" style=\"border:1px solid {{ f.border }};background:{{ f.bg }};border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer\">{{ f.label }} <span style=\"color:#8C8C8A\">{{ f.n }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ idea.items }}\" as=\"it\">\n          <div style=\"border:1px solid #E4E1DE;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n              <span style=\"font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:{{ it.tBg }};color:{{ it.tFg }}\">{{ it.type }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#8C8C8A\">{{ it.by }} · {{ it.at }} · {{ it.page }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;text-wrap:pretty\">{{ it.text }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n              <sc-if value=\"{{ it.canSet }}\">\n                <sc-raw-select value=\"{{ it.status }}\" sc-camel-on-change=\"{{ it.setStatus }}\" style=\"height:30px;border:1px solid #E4E1DE;border-radius:6px;padding:0 6px;font-size:12px;background:#FFFFFF\"><option value=\"nieuw\">Nieuw<\u002Foption><option value=\"opgepakt\">Opgepakt<\u002Foption><option value=\"opgelost\">Opgelost<\u002Foption><option value=\"niet\">Doen we niet<\u002Foption><\u002Fsc-raw-select>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ it.showStatus }}\"><span style=\"font-size:12px;font-weight:600;color:{{ it.sFg }}\">{{ it.statusLabel }}<\u002Fspan><\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ it.vote }}\" style=\"margin-left:auto;border:1px solid {{ it.vBorder }};background:{{ it.vBg }};border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer\">+1 · {{ it.votes }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ idea.empty }}\"><div style=\"padding:16px 0;text-align:center;font-size:14px;color:#8C8C8A\">Nog niets gemeld.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasToast }}\">\n  <div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1B1B63;color:#FFFFFF;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 32px rgba(29,29,27,.15);z-index:10\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;week&quot;,&quot;campaigns&quot;,&quot;checkin&quot;,&quot;history&quot;,&quot;rules&quot;],&quot;default&quot;:&quot;week&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showTrello&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\ncon pogingen', value: sum('contact'), sub: 'opnieuw bellen', fg: '#B45309', lfg: '#5C5C5A', bg: '#FFFFFF', border: '#E4E1DE' }\n      ]\n    };\n  }\n  trelloData() {\n    if (this.state.source === 'trello') return this.trelloLive();\n    const st = this.state, boards = {};\n    const add = (board, o) => { (boards[board] = boards[board] || { name: board, labels: [], isNew: false }).labels.push(o); };\n    st.campaigns.forEach(c => add(c.client, { name: c.vac, cards: c.weeks.reduce((s, w) => s + w.leads, 0), c }));\n    TR_EXTRA.forEach(x => {\n      const c = st.campaigns.find(k => k.client === x.board && k.vac === x.label);\n      if (!c) { add(x.board, { name: x.label, cards: x.cards, c: null }); if (x.isNew) boards[x.board].isNew = true; }\n    });\n    TR_INACTIVE.forEach(([board, labels, days]) => { boards[board] = { name: board, isNew: false, inactive: days, labels: labels.map((l, i) => ({ name: l, cards: 8 + ((days + i * 7) % 30), c: null })) }; });\n    let open = 0, linked = 0;\n    const list = Object.values(boards).filter(b => !b.inactive || st.trShowInactive).map((b, bi) => {\n      const labels = b.labels.map((l, li) => {\n        const key = b.name + '|' + l.name, ign = !!st.trIgnored[key];\n        const isOpen = !l.c && !ign && !b.inactive; if (isOpen) open++; if (l.c && !l.c.ended) linked++;\n        return {\n          name: l.name, cards: l.cards, color: LABEL_COLORS[(bi * 3 + li) % LABEL_COLORS.length], fg: ign ? '#8C8C8A' : '#1D1D1B',\n          isLinked: !!(l.c && !l.c.ended), isEnded: !!(l.c && l.c.ended), isIgnored: ign && !b.inactive, isOpen, isInactive: !!b.inactive && !l.c, rec: l.c ? l.c.rec : '',\n          sel: st.trSel[key] || '', open: () => l.c && this.open(l.c.id), showIgnore: true, canUnlink: false,\n          vac: st.trVac[key] ?? l.name, setVac: e => { const v = e.target.value; this.setState(s => ({ trVac: { ...s.trVac, [key]: v } })); },\n          setRec: e => { const v = e.target.value; this.setState(s => ({ trSel: { ...s.trSel, [key]: v } })); },\n          link: () => this.linkLabel(b.name, this.state.trVac[key] ?? l.name, l.cards, this.state.trSel[key]),\n          ignore: () => this.setState(s => ({ trIgnored: { ...s.trIgnored, [key]: true } })),\n          unignore: () => this.setState(s => { const t = { ...s.trIgnored }; delete t[key]; return { trIgnored: t }; })\n        };\n      });\n      const nOpen = labels.filter(l => l.isOpen).length;\n      return { name: b.name, isNew: b.isNew && nOpen > 0, found: 'vandaag gevonden', labels, nOpen, isInactive: !!b.inactive, inactiveText: b.inactive ? `Geen activiteit sinds ${b.inactive} dagen` : '', meta: `${labels.length} ${labels.length === 1 ? 'label' : 'labels'}${nOpen ? ` · ${nOpen} te koppelen` : ''}` };\n    }).sort((a, b) => (b.isNew - a.isNew) || (b.nOpen - a.nOpen) || a.name.localeCompare(b.name));\n    const shown = st.trTab === 'open' ? list.filter(b => b.nOpen > 0) : list;\n    const tab = (k, label, n) => ({ label, n, bg: st.trTab === k ? '#FFFFFF' : 'transparent', fg: st.trTab === k ? '#1D1D1B' : '#5C5C5A', sh: st.trTab === k ? '0 1px 4px rgba(29,29,27,.07)' : 'none', onClick: () => this.setState({ trTab: k }) });\n    return {\n      open, boards: shown, empty: shown.length === 0,\n      tabs: [tab('open', 'Te koppelen', open), tab('all', 'Alle borden', list.length)],\n      syncText: 'Demo · workspace gecontroleerd 09:15', hasNotice: false,\n      summary: `${list.length} borden · ${linked} campagnes live`,\n      inactiveText: st.trShowInactive ? `Inactieve borden verbergen` : `${TR_INACTIVE.length} borden zonder activiteit in 30 dagen verborgen · tonen`,\n      toggleInactive: () => this.setState(s => ({ trShowInactive: !s.trShowInactive }))\n    };\n  }\n  linkLabel(board, label, cards, rec) {\n    if (!rec) { this.flash('Kies eerst een recruiter'); return; }\n    const prevC = this.state.campaigns.find(c => c.client === board && !c.ended);\n    this.logAssign(board, prevC ? prevC.rec : '', rec);\n    const id = 'n' + Date.now();\n    const c = { id, client: board, vac: label, rec, start: CUR, ended: false, actions: [],\n      weeks: [{ w: CUR, leads: cards, q: null, rec: '', klant: '', note: '', needsAction: false, at: '', tr: { nieuw: cards, gescreend: 0, voorgesteld: 0, gesprek: 0, geplaatst: 0 } }] };\n    this.setState(s => ({ campaigns: [...s.campaigns, c] }));\n    this.flash(`${board} – ${label} staat live · ${rec}`);\n  }\n  showTrello() { return this.props.showTrello ?? true; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
